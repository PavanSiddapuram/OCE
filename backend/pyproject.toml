[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oce-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "arq>=0.26.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic-ai[openai]>=0.0.13",
    "openai>=1.30.0",
    "tavily-python>=0.3.3",
    "firecrawl-py>=1.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

